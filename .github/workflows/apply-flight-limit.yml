name: Apply verified flight-limit patch

on:
  push:
    branches: [agent/stop-flight-at-numeric-limit]

permissions:
  contents: write

concurrency:
  group: apply-flight-limit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stop-flight-at-numeric-limit
          fetch-depth: 0

      - name: Apply locally validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patchgz/part* > /tmp/flight-limit.patch.gz.b64
          base64 --decode /tmp/flight-limit.patch.gz.b64 | gzip -dc > /tmp/flight-limit.patch
          git apply --index /tmp/flight-limit.patch
          git diff --cached --check
          test -f src/fractal_flight_studio/flight.py
          grep -q 'version = "0.7.1"' pyproject.toml
          git rm -r .patchgz

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stop flights at numerical limits"
          git push origin HEAD:agent/stop-flight-at-numeric-limit
